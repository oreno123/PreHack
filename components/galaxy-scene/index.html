<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galaxy Repro — after blueyard.com 2024</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #intro {
    position: fixed; inset: 0; background: #000; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    transition: opacity 1.2s ease; user-select: none;
  }
  #intro.gone { opacity: 0; pointer-events: none; }
  #intro .logo { position: absolute; top: 28px; text-align: center; letter-spacing: .55em; font-size: 12px; color: #e8ecf4; }
  #ring {
    width: 168px; height: 168px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(190,205,230,.5);
    box-shadow: 0 0 0 12px rgba(120,150,200,.06), 0 0 0 26px rgba(120,150,200,.035), 0 0 60px rgba(90,140,220,.12) inset;
    display: flex; align-items: center; justify-content: center;
    letter-spacing: .45em; font-size: 13px; color: #cfd9ea; padding-left: .45em;
    transition: box-shadow .6s ease, color .6s ease;
  }
  #ring:hover { color: #fff; box-shadow: 0 0 0 12px rgba(120,150,200,.12), 0 0 0 26px rgba(120,150,200,.07), 0 0 90px rgba(90,140,220,.25) inset; }
  #skip { position: absolute; bottom: 30px; letter-spacing: .3em; font-size: 10px; color: #5a6270; cursor: pointer; }
  #hud {
    position: fixed; left: 24px; bottom: 22px; z-index: 5; color: rgba(220,228,240,.75);
    font-family: ui-monospace, Consolas, monospace; font-size: 11px; letter-spacing: .18em;
    user-select: none; opacity: 0; transition: opacity 1.5s ease; pointer-events: none;
  }
  #hud.on { opacity: 1; }
  #tag { position: fixed; top: 26px; left: 0; right: 0; text-align: center; z-index: 5;
    color: rgba(230,238,248,.85); font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; letter-spacing: .55em; user-select: none; opacity: 0; transition: opacity 1.5s ease; }
  #tag.on { opacity: 1; }
</style>
</head>
<body>
<div id="tag">GALAXY&nbsp;REPRO</div>
<div id="hud">DRAG&nbsp;ORBIT&nbsp;·&nbsp;SCROLL&nbsp;ZOOM</div>
<div id="intro">
  <div class="logo">BLUE&nbsp;YARD<br/><span style="letter-spacing:.55em">REPRO</span></div>
  <div id="ring">BEGIN</div>
  <div id="skip">CONTINUE&nbsp;WITHOUT&nbsp;AUDIO</div>
</div>
<script type="module" src="galaxy.mjs"></script>
</body>
</html>
